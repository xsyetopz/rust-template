# Test targets use the same policy as clippy.toml, except private helper items do not require public API docs.
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true
allow-dbg-in-tests = false
allow-useless-vec-in-tests = false
allow-large-stack-frames-in-tests = false
check-incompatible-msrv-in-tests = true
allow-expect-in-consts = true
allow-unwrap-in-consts = true
avoid-breaking-exported-api = false
check-private-items = false
warn-on-all-wildcard-imports = true
allow-mixed-uninlined-format-args = false
allow-one-hash-in-raw-strings = false
allow-private-module-inception = false
array-size-threshold = 512
stack-size-threshold = 4096
future-size-threshold = 4096
large-error-threshold = 128
pass-by-value-size-limit = 128
enum-variant-size-threshold = 128
max-include-file-size = 1048576
vec-box-size-threshold = 4096
cognitive-complexity-threshold = 25
too-many-arguments-threshold = 6
too-many-lines-threshold = 100
type-complexity-threshold = 250
disallowed-methods = [
    { path = "core::mem::forget", reason = "Use explicit ownership transfer or an explicitly managed destruction policy" },
    { path = "core::hint::unreachable_unchecked", reason = "Do not turn a reachable invalid state into undefined behavior" },
]
